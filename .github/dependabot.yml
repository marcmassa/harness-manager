version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Must equal the minimum VS Code in package.json `engines.vscode`; packaging fails
      # when the type definitions are newer than the supported editor.
      - dependency-name: "@types/vscode"
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
