name: Publish VSIX

# Trigger: when a tag matching v*.*.* is pushed.
# The CI workflow already validated the commit when it was merged to main;
# this workflow only packages and publishes the VSIX to the Marketplace.
# It does NOT re-run tests or checks.
on:
  push:
    tags:
      - 'v*.*.*'

# SHA-pinned for supply-chain security.
#   actions/checkout@v4 → 34e114876b0b11c390a56381ad16ebd13914f8d5
#   actions/setup-node@v4 → 49933ea5288caeca8642d1e84afbd3f7d6820020
permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      # Package the VSIX with vsce. The version string comes from
      # package.json, which must already be bumped.
      - name: Package VSIX
        run: npx vsce package --out harness-dashboard.vsix

      # FEAT-038 (vsix-asset-diet): gate at the point of no return.
      # publish.yml calls vsce directly (not `npm run package`), so the
      # gate gets its own explicit step here — belt-and-suspenders per
      # design §6: size < 300,000 B, zero extension/media/screenshots/
      # entries, required media + dist entries present.
      - name: VSIX gate (size + listing)
        run: bash scripts/vsix-gate.sh harness-dashboard.vsix

      # Publish to the VS Code Marketplace using the VSCE_PAT secret.
      # The PAT must have the `Marketplace` permission scope and be
      # stored in the GitHub repo or org secrets as `VSCE_PAT`.
      - name: Publish to Marketplace
        run: npx vsce publish --packagePath harness-dashboard.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
